# Managed by BC250 Control Center: prevent a stale Cyan fix-freq hwmon bind
# from racing service restart. The preflight only lazily unmounts Cyan's own
# bind source below the BC-250 PCI device; it never writes a register or
# changes a clock or voltage.
[Service]
ExecStartPre=/usr/libexec/bc250-control-center/bc250-cyan-overlay-preflight
