[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = """
-ra --strict-config --strict-markers
--cov=bc250cc.domain.fan.persistence
--cov=bc250cc.infrastructure.governor_conflicts
--cov=bc250cc.infrastructure.gpu.governor_toml
--cov=bc250cc.infrastructure.cpu_telemetry
--cov=frontends.desktop.core.external_links
--cov-report=term-missing
"""
qt_api = "pyqt6"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
omit = [
  "frontends/desktop/theme/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
